version: '3'

set: [pipefail]

vars:
  COMPOSE_FILE: deployments/docker/docker-compose.yml
  DOCKER_ENV_FILE: deployments/docker/.env
  LOCAL_ENV_FILE: .env

  # Windows Git Bash / PowerShell: Docker Desktop and Go tools must be available on PATH.

tasks:
  setup:
    desc: Prepare environment files for both local development and Docker deployment
    cmds:
      - task: setup:local
      - task: setup:docker

  setup:local:
    desc: Create local development environment file (.env) from template
    cmds:
      - |
        if [ ! -f "{{.LOCAL_ENV_FILE}}" ]; then
          cp .env.example "{{.LOCAL_ENV_FILE}}"
          echo "Created {{.LOCAL_ENV_FILE}} for local development."
        else
          echo "{{.LOCAL_ENV_FILE}} already exists"
        fi

  setup:docker:
    desc: Create Docker deployment environment file (deployments/docker/.env) from template
    cmds:
      - |
        if [ ! -f "{{.DOCKER_ENV_FILE}}" ]; then
          cp deployments/docker/.env.example "{{.DOCKER_ENV_FILE}}"
          echo "Created {{.DOCKER_ENV_FILE}}. Update OIDC and Postgres secrets for containerized execution."
        else
          echo "{{.DOCKER_ENV_FILE}} already exists"
        fi

  docker:up:
    desc: Build and start the complete containerized stack (http://localhost)
    deps: [setup:docker]
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" --env-file "{{.DOCKER_ENV_FILE}}" up --build -d

  docker:down:
    desc: Stop the complete containerized stack
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" --env-file "{{.DOCKER_ENV_FILE}}" down

  docker:reset:
    desc: Stop containers and remove persistent volumes (PostgreSQL data)
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" --env-file "{{.DOCKER_ENV_FILE}}" down -v

  docker:ps:
    desc: Show running CloudPilot containers
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" --env-file "{{.DOCKER_ENV_FILE}}" ps

  docker:logs:
    desc: Follow logs for all or one container service
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" --env-file "{{.DOCKER_ENV_FILE}}" logs -f {{.CLI_ARGS}}

  docker:api:
    desc: Rebuild and restart only the API service container
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" --env-file "{{.DOCKER_ENV_FILE}}" up --build -d api

  docker:frontend:
    desc: Rebuild and restart only the frontend service container
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" --env-file "{{.DOCKER_ENV_FILE}}" up --build -d frontend

  docker:worker:
    desc: Rebuild and restart only the worker service container
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" --env-file "{{.DOCKER_ENV_FILE}}" up --build -d worker

  frontend:install:
    desc: Install frontend dependencies
    dir: frontend
    cmds:
      - npm ci

  frontend:dev:
    desc: Run the Vite development server (http://localhost:5173)
    dir: frontend
    cmds:
      - npm run dev

  frontend:types:
    desc: Generate frontend TypeScript types from OpenAPI
    dir: frontend
    cmds:
      - npm run api:types

  frontend:lint:
    desc: Lint the frontend
    dir: frontend
    cmds:
      - npm run lint

  frontend:build:
    desc: Build the frontend for production
    dir: frontend
    cmds:
      - npm run build

  backend:test:
    desc: Run Go tests and vet checks
    dir: backend
    cmds:
      - gofmt -w ./cmd ./internal
      - go mod tidy
      - go test ./...
      - go vet ./...

  backend:run:
    desc: Run the API outside Docker (http://localhost:8080/cloudpilot)
    deps: [setup:local]
    dir: backend
    cmds:
      - go run ./cmd/api

  worker:run:
    desc: Run the discovery worker outside Docker
    deps: [setup:local]
    dir: backend
    cmds:
      - go run ./cmd/worker

  migrate:
    desc: Start PostgreSQL and apply embedded migrations during API startup
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" --env-file "{{.DOCKER_ENV_FILE}}" up -d postgres
      - docker compose -f "{{.COMPOSE_FILE}}" --env-file "{{.DOCKER_ENV_FILE}}" up --build -d api

  compose:config:
    desc: Validate Docker Compose configuration
    cmds:
      - docker compose -f "{{.COMPOSE_FILE}}" --env-file "{{.DOCKER_ENV_FILE}}" config --quiet

  check:
    desc: Run focused project validation
    cmds:
      - task: frontend:types
      - task: frontend:lint
      - task: frontend:build
      - task: backend:test
      - task: compose:config

  default:
    desc: Show available project tasks
    cmds:
      - task --list
