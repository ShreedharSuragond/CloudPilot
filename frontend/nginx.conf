server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        proxy_pass http://api:8080/healthz;
    }

    location /readyz {
        proxy_pass http://api:8080/readyz;
    }

    location /auth/ {
        proxy_pass http://api:8080/auth/;
    }
}
