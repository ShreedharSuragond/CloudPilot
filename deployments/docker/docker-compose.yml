services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudpilot}
      POSTGRES_USER: ${POSTGRES_USER:-cloudpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set a local password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        APP: api
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-cloudpilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cloudpilot}?sslmode=disable
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-http://localhost:8080/auth/callback}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        APP: worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cloudpilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cloudpilot}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
